[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:postgres]
command=/usr/local/bin/docker-entrypoint.sh postgres
user=postgres
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
priority=10

[program:redis]
command=/usr/bin/redis-server --daemonize no
user=redis
autostart=true
autorestart=true
startretries=3
startsecs=2
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
priority=20

[program:app]
command=/app/wait-for-services.sh
user=root
autostart=true
autorestart=true
startretries=3
startsecs=10
stdout_logfile=/var/log/supervisor/app.log
stderr_logfile=/var/log/supervisor/app.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
priority=30
